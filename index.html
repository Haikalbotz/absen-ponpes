<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pemantauan Santri | Ponpes Maslakul Iman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%); min-height: 100vh; padding-bottom: 2rem; }
        .navbar { background: linear-gradient(135deg, #1a472a, #0d2b1c); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; position: sticky; top: 0; z-index: 100; }
        .nav-btn { background: rgba(255,255,255,0.15); border: none; padding: 6px 14px; border-radius: 40px; color: white; cursor: pointer; margin: 0 4px; }
        .nav-btn.active { background: #fbbf24; color: #1a472a; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
        .dashboard-grid { display: none; animation: fadeIn 0.3s ease; }
        .dashboard-grid.active { display: block; }
        .card { background: white; border-radius: 1.5rem; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .card h3 { color: #1a472a; border-left: 4px solid #fbbf24; padding-left: 12px; margin-bottom: 1rem; }
        input, textarea { width: 100%; padding: 10px; border-radius: 40px; border: 1px solid #cbd5e1; margin-bottom: 8px; }
        textarea { border-radius: 12px; }
        .btn { background: #1a472a; color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; margin: 4px; }
        .btn-warning { background: #fbbf24; color: #1a472a; }
        .btn-danger { background: #dc2626; }
        .santri-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-height: 500px; overflow-y: auto; }
        .santri-card { background: #f8fafc; border-radius: 1rem; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .santri-card.selected-hadir { border-color: #10b981; background: #d1fae5; }
        .santri-card.selected-izin { border-color: #f59e0b; background: #fed7aa; }
        .santri-card.selected-sakit { border-color: #3b82f6; background: #dbeafe; }
        .santri-card.selected-alpha { border-color: #ef4444; background: #fee2e2; }
        .status-options { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .status-option { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; background: white; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 1rem; max-width: 320px; width: 90%; text-align: center; }
        .toast { position: fixed; bottom: 20px; left: 20px; background: #1a472a; color: white; padding: 8px 16px; border-radius: 40px; opacity: 0; transition: 0.2s; z-index: 1100; }
        .santri-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafc; margin-bottom: 6px; border-radius: 40px; }
        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 640px) { .two-columns { grid-template-columns: 1fr; } }
        .live-badge { background: #10b98120; color: #10b981; padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; margin-left: 8px; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo"><h2><i class="fas fa-mosque"></i> Maslakul Iman <span class="live-badge"><i class="fas fa-globe"></i> LIVE</span></h2></div>
    <div class="nav-buttons">
        <button class="nav-btn" data-page="admin">👑 Admin</button>
        <button class="nav-btn" data-page="parent">👪 Pantau</button>
        <button class="nav-btn" data-page="attendance">📋 Absensi</button>
    </div>
</div>
<div class="container">
    <div id="adminPage" class="dashboard-grid">
        <div class="card"><h3>Statistik</h3><div id="statBox"></div></div>
        <div class="card"><h3>Kelola Santri</h3><div style="display:flex; gap:10px;"><input type="text" id="namaSantriBaru" placeholder="Nama Santri" style="flex:1;"><button class="btn" id="tambahSantriwanBtn">+ Santriwan</button><button class="btn" id="tambahSantriwatiBtn">+ Santriwati</button></div>
        <div class="two-columns"><div><h4>Santriwan</h4><div id="listWan"></div></div><div><h4>Santriwati</h4><div id="listWati"></div></div></div></div>
        <div class="card"><h3>Manajemen Tugas</h3><input type="text" id="tugasJudul" placeholder="Judul Tugas"><textarea id="tugasDesc" rows="2" placeholder="Deskripsi"></textarea><button class="btn" id="btnTambahTugas">Simpan Tugas</button><div id="tugasListAdmin" style="margin-top:15px;"></div></div>
    </div>
    <div id="parentPage" class="dashboard-grid">
        <div class="card"><h3>Rekap Kehadiran</h3><canvas id="parentChart" style="max-height:200px"></canvas></div>
        <div class="card"><h3>Tugas Terbaru</h3><div id="parentTugasList"></div></div>
        <div class="card"><h3>Status Santri</h3><div id="parentSantriStatus"></div></div>
    </div>
    <div id="attendancePage" class="dashboard-grid">
        <div class="card"><h3>Absensi Hari Ini</h3><div class="santri-grid" id="absenContainer"></div><div style="margin-top:1rem;"><button class="btn btn-warning" id="resetAbsenBtn">Reset</button><button class="btn" id="sendWABtn">Kirim WA</button></div></div>
    </div>
</div>
<div id="toastMsg" class="toast"></div>
<div id="passwordModal" class="modal"><div class="modal-content"><h3>Akses Terbatas</h3><p id="modalMsg"></p><input type="password" id="passInput"><div><button id="passConfirm">Masuk</button><button id="passCancel">Batal</button></div></div></div>

<script>
    // ======================= KONFIGURASI (⚠️ GANTI DENGAN LINK ANDA) =======================
    const CSV_SANTRIWAN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQj934LvpLD3x5EZ_t6eykdBUUy2ksOA1SJ8b0DYIibarFokQOqshgDsqJrX3yT_lwzdz0MmUOy8sqk/pub?gid=0&single=true&output=csv";
    const CSV_SANTRIWATI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQj934LvpLD3x5EZ_t6eykdBUUy2ksOA1SJ8b0DYIibarFokQOqshgDsqJrX3yT_lwzdz0MmUOy8sqk/pub?gid=491190605&single=true&output=csv";
    const CSV_TUGAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQj934LvpLD3x5EZ_t6eykdBUUy2ksOA1SJ8b0DYIibarFokQOqshgDsqJrX3yT_lwzdz0MmUOy8sqk/pub?gid=1689847811&single=true&output=csv";
    const CSV_ABSEN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQj934LvpLD3x5EZ_t6eykdBUUy2ksOA1SJ8b0DYIibarFokQOqshgDsqJrX3yT_lwzdz0MmUOy8sqk/pub?gid=20112682&single=true&output=csv";
    
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwA5uggrEyOkU7cVXuvK1BhvkuCthvFy14dp03L3tsiNSV_43MQGE6gAy68khn_0Tpk/exec";
    
    let santriwan = [], santriwati = [], attendance = {}, tugas = [];
    let parentChart = null;
    let pendingResolve = null;

    // ======================= FUNGSI BACA CSV =======================
    async function fetchCSV(url) {
        try {
            const res = await fetch(url);
            const text = await res.text();
            const rows = text.split("\n").filter(r => r.trim());
            if (rows.length < 2) return [];
            return rows.slice(1).map(r => {
                let cleaned = r.replace(/^"|"$/g, '');
                let firstCol = cleaned.split(",")[0];
                return firstCol;
            }).filter(n => n && n !== "Nama" && n !== "nama" && n !== "Judul");
        } catch(e) { 
            console.error("Fetch error:", url, e);
            return []; 
        }
    }

    async function loadSantriFromSheets() {
        const [wan, wati] = await Promise.all([fetchCSV(CSV_SANTRIWAN), fetchCSV(CSV_SANTRIWATI)]);
        santriwan = wan;
        santriwati = wati;
        renderSantriLists();
        renderAttendance();
        renderParentView();
        updateStatBox();
        showToast(`📥 Santri: ${santriwan.length} santriwan, ${santriwati.length} santriwati`);
    }

    async function loadTugasFromSheet() {
        const data = await fetchCSV(CSV_TUGAS);
        // Data dari CSV tugas: kolom 1=judul, kolom2=deskripsi, kolom3=target, kolom4=tanggal
        tugas = data.map((judul, i) => ({ id: i, judul, deskripsi: "Detail tugas", target: "all", tanggal: new Date().toLocaleDateString() }));
        renderAdminTugas();
        renderParentView();
    }

    async function loadAbsenFromSheet() {
        const data = await fetchCSV(CSV_ABSEN);
        // Data dari CSV absen: kolom1=tanggal, kolom2=nama, kolom3=status
        const newAttendance = {};
        const today = new Date().toISOString().split('T')[0];
        for (let i = 0; i < data.length; i += 3) {
            if (data[i] === today) {
                newAttendance[data[i+1]] = data[i+2];
            }
        }
        attendance = newAttendance;
        renderAttendance();
        renderParentView();
        updateParentChart();
        updateStatBox();
    }

    // ======================= FUNGSI TAMBAH SANTRI (Lokal) =======================
    function tambahSantri(gender, nama) {
        if (!nama.trim()) return showToast("Nama tidak boleh kosong");
        if (gender === "wan") {
            if (santriwan.includes(nama)) return showToast("Nama sudah ada");
            santriwan.push(nama);
            santriwan.sort();
        } else {
            if (santriwati.includes(nama)) return showToast("Nama sudah ada");
            santriwati.push(nama);
            santriwati.sort();
        }
        localStorage.setItem("santriwan_list", JSON.stringify(santriwan));
        localStorage.setItem("santriwati_list", JSON.stringify(santriwati));
        renderSantriLists();
        renderAttendance();
        updateStatBox();
        showToast(`✅ ${nama} ditambahkan`);
    }

    function hapusSantri(gender, nama) {
        if (!confirm(`Hapus ${nama}?`)) return;
        if (gender === "wan") santriwan = santriwan.filter(n => n !== nama);
        else santriwati = santriwati.filter(n => n !== nama);
        localStorage.setItem("santriwan_list", JSON.stringify(santriwan));
        localStorage.setItem("santriwati_list", JSON.stringify(santriwati));
        renderSantriLists();
        renderAttendance();
        updateStatBox();
    }

    // ======================= RENDER =======================
    function renderSantriLists() {
        document.getElementById("listWan").innerHTML = santriwan.map(n => `<div class="santri-item"><span>👨 ${n}</span><button class="btn-danger" style="padding:4px 12px;" onclick="hapusSantri('wan','${n}')">Hapus</button></div>`).join("");
        document.getElementById("listWati").innerHTML = santriwati.map(n => `<div class="santri-item"><span>👩 ${n}</span><button class="btn-danger" style="padding:4px 12px;" onclick="hapusSantri('wati','${n}')">Hapus</button></div>`).join("");
    }

    function renderAdminTugas() {
        const container = document.getElementById("tugasListAdmin");
        if (!tugas.length) { container.innerHTML = "<p>Belum ada tugas</p>"; return; }
        container.innerHTML = tugas.map(t => `<div style="background:#f1f5f9;padding:10px;border-radius:12px;margin-bottom:8px;"><strong>📌 ${t.judul}</strong><br><small>${t.deskripsi || "-"}</small><br><small>📅 ${t.tanggal}</small></div>`).join("");
    }

    function renderAttendance() {
        const allSantri = [...santriwan, ...santriwati];
        const container = document.getElementById("absenContainer");
        if (!allSantri.length) { container.innerHTML = "<p>Belum ada santri</p>"; return; }
        container.innerHTML = allSantri.map(s => {
            const status = attendance[s] || "";
            let cls = "";
            if (status === "hadir") cls = "selected-hadir";
            else if (status === "izin") cls = "selected-izin";
            else if (status === "sakit") cls = "selected-sakit";
            else if (status === "alpha") cls = "selected-alpha";
            return `<div class="santri-card ${cls}" data-name="${s}"><div><strong>${s}</strong></div><div class="status-options"><span class="status-option" data-status="hadir">✅ Hadir</span><span class="status-option" data-status="izin">📝 Izin</span><span class="status-option" data-status="sakit">🤒 Sakit</span><span class="status-option" data-status="alpha">❌ Alpha</span></div><div>${status ? status.toUpperCase() : "Belum"}</div></div>`;
        }).join("");
        document.querySelectorAll(".status-option").forEach(opt => opt.onclick = (e) => { e.stopPropagation(); const name = opt.closest(".santri-card").dataset.name; updateAbsenLocal(name, opt.dataset.status); });
    }

    function updateAbsenLocal(nama, status) {
        attendance[nama] = status;
        localStorage.setItem("attendance_today", JSON.stringify(attendance));
        renderAttendance();
        renderParentView();
        updateParentChart();
        updateStatBox();
        showToast(`${nama}: ${status}`);
        // Opsional: kirim ke Apps Script jika perlu
    }

    function resetAbsen() {
        if (confirm("Reset semua absen?")) {
            attendance = {};
            localStorage.setItem("attendance_today", JSON.stringify(attendance));
            renderAttendance();
            renderParentView();
            updateParentChart();
            updateStatBox();
            showToast("Absen direset");
        }
    }

    function renderParentView() {
        const allSantri = [...santriwan, ...santriwati];
        document.getElementById("parentSantriStatus").innerHTML = allSantri.map(s => `<div style="padding:6px; border-bottom:1px solid #ccc;"><strong>${s}</strong> : ${attendance[s] || "Belum"}</div>`).join("");
        if (!tugas.length) { document.getElementById("parentTugasList").innerHTML = "<p>Belum ada tugas</p>"; return; }
        document.getElementById("parentTugasList").innerHTML = tugas.map(t => `<div style="background:#f1f5f9;padding:10px;border-radius:12px;margin-bottom:8px;"><strong>📖 ${t.judul}</strong><br>${t.deskripsi}<br><small>📅 ${t.tanggal}</small></div>`).join("");
    }

    function updateParentChart() {
        const ctx = document.getElementById("parentChart")?.getContext("2d");
        if (!ctx) return;
        const hadir = Object.values(attendance).filter(v=>v==="hadir").length;
        const izin = Object.values(attendance).filter(v=>v==="izin").length;
        const sakit = Object.values(attendance).filter(v=>v==="sakit").length;
        const alpha = Object.values(attendance).filter(v=>v==="alpha").length;
        if (parentChart) parentChart.destroy();
        parentChart = new Chart(ctx, { type: 'bar', data: { labels: ['Hadir','Izin','Sakit','Alpha'], datasets: [{ data: [hadir,izin,sakit,alpha], backgroundColor: ['#10b981','#f59e0b','#3b82f6','#ef4444'] }] } });
    }

    function updateStatBox() {
        document.getElementById("statBox").innerHTML = `<div style="display:flex; gap:10px; flex-wrap:wrap;"><div>👨 Santriwan: ${santriwan.length}</div><div>👩 Santriwati: ${santriwati.length}</div><div>📋 Tugas: ${tugas.length}</div><div>✅ Hadir: ${Object.values(attendance).filter(v=>v==="hadir").length}</div></div>`;
    }

    function sendWA() {
        const today = new Date().toLocaleDateString('id-ID');
        let hadir=[], izin=[], sakit=[], alpha=[];
        [...santriwan,...santriwati].forEach(n => { const s = attendance[n]||"alpha"; if(s==="hadir") hadir.push(n); else if(s==="izin") izin.push(n); else if(s==="sakit") sakit.push(n); else alpha.push(n); });
        let msg = `📋 LAPORAN ABSEN NGAJI\n🏫 Maslakul Iman\n📅 ${today}\n━━━━━━━━━━━━━━━━\n✅ Hadir(${hadir.length}): ${hadir.join(", ")||"-"}\n📝 Izin(${izin.length}): ${izin.join(", ")||"-"}\n🤒 Sakit(${sakit.length}): ${sakit.join(", ")||"-"}\n❌ Alpha(${alpha.length}): ${alpha.join(", ")||"-"}\n━━━━━━━━━━━━━━━━\n🤲 Barakallah!`;
        window.open(`https://wa.me/6289528157038?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function showToast(msg) { const t = document.getElementById("toastMsg"); t.innerText = msg; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 2000); }

    // ======================= PASSWORD =======================
    function showPasswordModal(page) { return new Promise(r => { pendingResolve = r; document.getElementById("modalMsg").innerHTML = `Password ${page}`; document.getElementById("passwordModal").classList.add("active"); }); }
    document.getElementById("passConfirm").onclick = () => { if(pendingResolve) pendingResolve(document.getElementById("passInput").value); closeModal(); };
    document.getElementById("passCancel").onclick = () => { if(pendingResolve) pendingResolve(null); closeModal(); };
    function closeModal() { document.getElementById("passwordModal").classList.remove("active"); document.getElementById("passInput").value = ""; }

    async function switchPage(page) {
        if (page === "admin") { const pwd = await showPasswordModal("Admin"); if (pwd !== "adminiman") { alert("Salah!"); return; } }
        if (page === "attendance") { const pwd = await showPasswordModal("Absensi"); if (pwd !== "guruhebat") { alert("Salah!"); return; } }
        document.querySelectorAll(".dashboard-grid").forEach(el => el.classList.remove("active"));
        document.getElementById(page + "Page").classList.add("active");
    }

    // ======================= EVENT & START =======================
    document.querySelectorAll(".nav-btn").forEach(btn => btn.onclick = () => switchPage(btn.dataset.page));
    document.getElementById("tambahSantriwanBtn").onclick = () => { tambahSantri("wan", document.getElementById("namaSantriBaru").value); document.getElementById("namaSantriBaru").value = ""; };
    document.getElementById("tambahSantriwatiBtn").onclick = () => { tambahSantri("wati", document.getElementById("namaSantriBaru").value); document.getElementById("namaSantriBaru").value = ""; };
    document.getElementById("btnTambahTugas").onclick = () => { showToast("Fitur tambah tugas via CSV sedang dalam pengembangan"); };
    document.getElementById("resetAbsenBtn").onclick = resetAbsen;
    document.getElementById("sendWABtn").onclick = sendWA;

    const storedWan = localStorage.getItem("santriwan_list");
    const storedWati = localStorage.getItem("santriwati_list");
    if (storedWan) santriwan = JSON.parse(storedWan);
    if (storedWati) santriwati = JSON.parse(storedWati);
    
    loadSantriFromSheets();
    loadTugasFromSheet();
    loadAbsenFromSheet();
    setInterval(() => { loadAbsenFromSheet(); loadTugasFromSheet(); }, 15000);
</script>
</body>
</html>
